name: Test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# The duckdb range ldrs is tested against.
env:
  DUCKDB_MIN: "1.2.1"
  DUCKDB_MAX: "1.5.2"

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    # Backstop for a blocked spawned child
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions/setup-go@v5
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Set up DuckDB
        run: |
          scripts/setup_duckdb.sh "$DUCKDB_MIN" "$DUCKDB_MAX"
          echo "$HOME/.duckdb/cli/$DUCKDB_MAX" >> "$GITHUB_PATH"
        shell: bash
      - name: Setup Postgres
        run: scripts/setup_test.sh
        shell: bash
      - run: cargo test
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
      - name: DuckDB floor
        run: |
          PATH="$HOME/.duckdb/cli/$DUCKDB_MIN:$PATH" \
            cargo test -p ldrs --test duckdb_integration -- --skip postgres
        shell: bash
      - name: Shutdown Postgres
        run: scripts/shutdown_test.sh
        shell: bash
