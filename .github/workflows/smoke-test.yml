name: smoke-test

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  smoke:
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch built artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Extract the linux binary
        shell: bash
        run: |
          tarball=artifacts/ldrs-x86_64-unknown-linux-gnu.tar.xz
          mkdir -p extracted
          tar xf "$tarball" -C extracted
          LDRS_BIN=$(find extracted -type f -name ldrs | head -1)
          if [ -z "$LDRS_BIN" ]; then
            echo "no ldrs binary found in '$tarball'" >&2
            exit 1
          fi
          chmod +x "$LDRS_BIN"
          echo "LDRS_BIN=$LDRS_BIN" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run smoke test
        run: uv run --script scripts/smoke.py "$LDRS_BIN"
